services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk_saas
    ports:
      - '5435:5432'
    volumes:
      - helpdesk_saas_data:/var/lib/postgresql/data

volumes:
  helpdesk_saas_data:
